<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Судья</title><link rel="stylesheet" href="css/style.css"></head><body><main class="card wide"><header class="top"><div><h1>Панель судьи</h1><p id="who"></p></div><button id="logout">Выйти</button></header><p id="msg"></p><section class="panel"><h2>Создать игру</h2><input id="title" placeholder="Название игры"><div class="two"><input id="teamA" placeholder="Команда A"><input id="teamB" placeholder="Команда B"></div><button id="create">Создать</button></section><section class="panel"><h2>Управление</h2><select id="match"></select><div class="row"><button id="start">Начать</button><button id="pause">Пауза</button><button id="resume">Продолжить</button><button id="finish">Завершить</button></div><div id="info"></div></section><section class="panel"><h2>Чат</h2><div id="chat"></div><form id="chatForm"><input id="chatInput" maxlength="500" placeholder="Сообщение"><button>Отправить</button></form></section></main><script type="module" src="js/judge.js"></script></body></html>
